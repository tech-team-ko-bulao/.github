    <text x="850" y="0" text-anchor="end" class="mono" font-size="10" fill="#52525B">TOOLSET 2026</text>
  </g>

  <!-- Row 1: Languages -->
  <g transform="translate(25, 42)">
    <rect width="110" height="28" rx="6" fill="#13141C" stroke="#3B82F6" stroke-width="0.8"/>
    <text x="12" y="18" class="mono" font-size="10.5" font-weight="700" fill="#60A5FA">LANGUAGES</text>

    <!-- Pills -->
    <g transform="translate(125, 0)">
      <rect width="40" height="28" rx="6" fill="#18181B" stroke="#27272A"/><text x="20" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E4E4E7">C</text>
      <rect x="48" width="50" height="28" rx="6" fill="#18181B" stroke="#27272A"/><text x="73" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E4E4E7">C++</text>
      <rect x="106" width="55" height="28" rx="6" fill="#18181B" stroke="#27272A"/><text x="133" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E4E4E7">Java</text>
      <rect x="169" width="70" height="28" rx="6" fill="#18181B" stroke="#27272A"/><text x="204" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E4E4E7">Python</text>
      <rect x="247" width="95" height="28" rx="6" fill="#18181B" stroke="#27272A"/><text x="294" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E4E4E7">JavaScript</text>
      <rect x="350" width="95" height="28" rx="6" fill="#18181B" stroke="#27272A"/><text x="397" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E4E4E7">TypeScript</text>
