<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" height="100%">
  <defs>
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0E"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Base -->
  <rect width="900" height="250" rx="14" fill="url(#stackBg)" stroke="#222228" stroke-width="1.2"/>

  <!-- Header -->
  <g transform="translate(25, 20)">
