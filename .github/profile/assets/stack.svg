      <rect x="78" width="105" height="28" rx="6" fill="#18181B" stroke="#27272A"/><text x="130" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E4E4E7">scikit-learn</text>
      <rect x="191" width="85" height="28" rx="6" fill="#18181B" stroke="#27272A"/><text x="233" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E4E4E7">LLM APIs</text>
