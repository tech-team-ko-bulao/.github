      <rect x="53" width="70" height="28" rx="6" fill="#18181B" stroke="#27272A"/><text x="88" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E4E4E7">GitHub</text>
      <rect x="131" width="75" height="28" rx="6" fill="#18181B" stroke="#27272A"/><text x="168" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E4E4E7">VS Code</text>
      <rect x="214" width="135" height="28" rx="6" fill="#18181B" stroke="#27272A"/><text x="281" y="18" text-anchor="middle" class="mono" font-size="11" font-weight="600" fill="#E4E4E7">AI coding tools</text>
