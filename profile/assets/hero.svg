<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="50%" stop-color="#0E0E12"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="limeGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#A3E635" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#A3E635" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F4F4F5"/>
      <stop offset="85%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>

    <linearGradient id="accentBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#A3E635" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.6"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#27272A" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>

    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Menlo, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.3); }
      }
      .pulse-dot {
        animation: pulseDot 2s ease-in-out infinite;
        transform-origin: 52px 42px;
      }

      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: cursorBlink 1s infinite;
      }

      @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(320px); }
      }
      .scan {
        animation: scanline 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <rect width="900" height="320" rx="16" fill="url(#grid)"/>

  <!-- Radial Atmosphere Lighting -->
  <rect width="900" height="320" rx="16" fill="url(#cyanGlow)"/>
  <rect width="900" height="320" rx="16" fill="url(#limeGlow)"/>
  <rect width="900" height="320" rx="16" fill="url(#violetGlow)"/>

  <!-- Outer Glass Border -->
  <rect x="1" y="1" width="898" height="318" rx="15" fill="none" stroke="url(#accentBorder)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Corner Tech Reticles -->
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 888 28 L 888 12 L 872 12" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 12 292 L 12 308 L 28 308" fill="none" stroke="#A3E635" stroke-width="2" stroke-linecap="round"/>
  <path d="M 888 292 L 888 308 L 872 308" fill="none" stroke="#A3E635" stroke-width="2" stroke-linecap="round"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(40, 28)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#121216" stroke="#27272A" stroke-width="1"/>
    <circle class="pulse-dot" cx="14" cy="14" r="4.5" fill="#00FF66"/>
    <text x="27" y="18" fill="#F4F4F5" class="mono" font-size="10.5" font-weight="700" letter-spacing="0.5">STATUS // ONLINE</text>

    <!-- Center Monospace Tag -->
    <text x="410" y="18" text-anchor="middle" fill="#71717A" class="mono" font-size="11" letter-spacing="1">COLLEGE TECH SQUAD • INITIATIVE</text>

    <!-- Right Squad Tag -->
    <rect x="670" y="0" width="150" height="28" rx="14" fill="#121216" stroke="#27272A" stroke-width="1"/>
    <text x="745" y="18" text-anchor="middle" fill="#A3E635" class="mono" font-size="10.5" font-weight="700" letter-spacing="0.8">5 BUILDERS // SQUAD</text>
  </g>

  <!-- Horizontal Divider Line with Accent -->
  <line x1="40" y1="72" x2="860" y2="72" stroke="#27272A" stroke-width="1"/>
  <line x1="40" y1="72" x2="160" y2="72" stroke="#00F0FF" stroke-width="2"/>
  <line x1="740" y1="72" x2="860" y2="72" stroke="#A3E635" stroke-width="2"/>

  <!-- Main Hero Brand Typography -->
  <g transform="translate(45, 134)">
    <text x="0" y="0" class="sans" font-size="46" font-weight="900" letter-spacing="3" fill="url(#titleGrad)">TECH TEAM KO BULAO</text>
  </g>

  <!-- Sub-headline Track -->
  <g transform="translate(48, 168)">
    <text x="0" y="0" class="mono" font-size="13.5" font-weight="700" letter-spacing="2.5" fill="#00F0FF">&gt; 5 BUILDERS</text>
    <text x="145" y="0" class="mono" font-size="13.5" font-weight="500" fill="#52525B">•</text>
    <text x="170" y="0" class="mono" font-size="13.5" font-weight="700" letter-spacing="2.5" fill="#FFFFFF">1 SQUAD</text>
    <text x="260" y="0" class="mono" font-size="13.5" font-weight="500" fill="#52525B">•</text>
    <text x="285" y="0" class="mono" font-size="13.5" font-weight="700" letter-spacing="2.5" fill="#A3E635">ENDLESS BUILDS</text>
    <rect class="cursor" x="445" y="-12" width="8" height="15" fill="#00F0FF"/>
  </g>

  <!-- Manifesto Quote Box -->
  <g transform="translate(45, 196)">
    <rect x="0" y="0" width="810" height="42" rx="8" fill="#121217" stroke="#27272A" stroke-width="1"/>
    <path d="M 12 14 L 18 21 L 12 28" fill="none" stroke="#A3E635" stroke-width="2" stroke-linecap="round"/>
    <text x="32" y="26" class="sans" font-size="14.5" font-weight="500" fill="#E4E4E7">
      "Building, breaking, learning and shipping together."
    </text>
    <text x="795" y="26" text-anchor="end" class="mono" font-size="11" fill="#71717A">// 2026</text>
  </g>

  <!-- Bottom Focus Area Pills -->
  <g transform="translate(45, 260)">
    <!-- Hackathons -->
    <g transform="translate(0, 0)">
      <rect width="145" height="30" rx="6" fill="#13171F" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5"/>
      <text x="72" y="19" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#67E8F9" letter-spacing="0.5">⚡ HACKATHONS</text>
    </g>

    <!-- AI/ML -->
    <g transform="translate(160, 0)">
      <rect width="125" height="30" rx="6" fill="#141C15" stroke="#A3E635" stroke-width="1" stroke-opacity="0.5"/>
      <text x="62" y="19" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#BEF264" letter-spacing="0.5">✦ AI / ML</text>
    </g>

    <!-- Full-Stack -->
    <g transform="translate(300, 0)">
      <rect width="150" height="30" rx="6" fill="#171822" stroke="#818CF8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="75" y="19" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#A5B4FC" letter-spacing="0.5">◈ FULL-STACK</text>
    </g>

    <!-- DSA -->
    <g transform="translate(465, 0)">
      <rect width="115" height="30" rx="6" fill="#201715" stroke="#FB923C" stroke-width="1" stroke-opacity="0.5"/>
      <text x="57" y="19" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#FDBA74" letter-spacing="0.5">⚙ DSA</text>
    </g>

    <!-- Open Source -->
    <g transform="translate(595, 0)">
      <rect width="150" height="30" rx="6" fill="#1C1523" stroke="#C084FC" stroke-width="1" stroke-opacity="0.5"/>
      <text x="75" y="19" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#E9D5FF" letter-spacing="0.5">★ OPEN SOURCE</text>
    </g>
  </g>
</svg>